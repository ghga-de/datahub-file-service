[project]
name = "dhfs"
version = "3.0.1"
description = "Data Hub File Service - a service enabling file inspection and re-encryption at Data Hubs"
dependencies = [
    "typer >= 0.25.1",
    "ghga-service-commons[auth,http,objectstorage,transports,crypt] >= 7.0",
    "hexkit[s3] >= 8.2.1",
    "crypt4gh >= 1.7",
    "async-lru >= 2.1.0",
]

[project.urls]
Repository = "https://github.com/ghga-de/datahub-file-service"

[project.scripts]
dhfs = "dhfs.__main__:run"
